# Seed replicate — wave768 on the M2 protocol (d384), curing the n=1
# winner's-curse on the d384 efficiency point. Standalone (shallow merge).
model:
  block_size: 1024
  vocab_size: 131072
  n_layer: 6
  n_head: 6
  d_model: 384
  dropout: 0.0
data:
  dir: data/m2
  tables_dir: data/tables
codec: {name: wave, d_complex: 768, seed: 0, normalize: l2, table: wave768_l2}
train:
  device: null
  batch_size: 4
  grad_accum: 8
  max_steps: 3000
  lr: 6.0e-4
  warmup: 200
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_iters: 50
  log_every: 20
  seed: 1338
  data_seed: 43
out_root: results/m5_seeds
