# M6 arm — external tokenizer Qwen/Qwen2.5-7B (V=151,665, byte-bpe)
# Standalone config: load_config merges shallowly, so every block is complete.
model:
  block_size: 1024
  vocab_size: 151665
  n_layer: 6
  n_head: 6
  d_model: 384
  dropout: 0.0
data:
  dir: data/m6/qwen2.5-7b
  tables_dir: data/tables/m6_qwen2.5-7b
codec: {name: onehot, pos_dim: 16, table: onehot16}
train:
  device: null
  batch_size: 4
  grad_accum: 8
  max_steps: 3000
  lr: 6.0e-4
  warmup: 200
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_iters: 50
  log_every: 20
  seed: 1337
  data_seed: 42
out_root: results/m6
