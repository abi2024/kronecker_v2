# M3 seed replicate at d512 — resolves the wave768-vs-albert call (1.1 sigma at n=1).
# Standalone config: load_config merges shallowly, so every block is complete.
# out_root is results/m3_seeds because results/m3 is FROZEN under m3-closed.
model:
  block_size: 1024
  vocab_size: 131072
  n_layer: 12
  n_head: 8
  d_model: 512
  dropout: 0.0
data:
  dir: data/m3
  tables_dir: data/tables
codec: {name: wave, d_complex: 768, seed: 0, normalize: l2, table: wave768_l2}
train:
  device: null
  batch_size: 4
  grad_accum: 8
  max_steps: 3000
  lr: 6.0e-4
  warmup: 200
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_iters: 50
  log_every: 20
  seed: 1339
  data_seed: 44
out_root: results/m3_seeds
