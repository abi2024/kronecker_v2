# Everything identical across M2 arms. If a value lives here, it is NOT the
# variable under test.
model:
  block_size: 1024
  vocab_size: 131072
  n_layer: 6
  n_head: 6
  d_model: 384
  dropout: 0.0
data:
  dir: data/m2
  tables_dir: data/tables
train:
  device: null            # auto: cuda if available
  batch_size: 8           # micro-batch; logits are the VRAM hog at V=131K
  grad_accum: 4           # effective 32,768 tokens/step
  max_steps: 3000         # ~98M tokens
  lr: 6.0e-4
  warmup: 200
  min_lr_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_iters: 100
  log_every: 20
  seed: 1337              # same across arms => identical body init (verified)
  data_seed: 42           # same across arms => identical batch order
out_root: results/m2
